<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winner Società Cooperativa - Nota Spese</title>
    <!-- Bootstrap per una grafica professionale -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { background-color: #2c3e50; min-height: 100vh; color: white; padding-top: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
        .menu-btn {
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            color: #fff !important;
            background-color: #28a745 !important; /* Verde fisso per l'unica sezione attiva */
            padding: 12px 15px;
            margin-bottom: 6px;
            border-left: 4px solid #fff;
            font-size: 14px;
            font-weight: bold;
        }
        .card-custom { background: white; border: 1px solid #e3e6f0; border-radius: 0.35rem; box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15); padding: 20px; margin-bottom: 20px; }
        .table-custom th { background-color: #343a40; color: white; text-align: center; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- 🗂️ MENU LATERALE: SOLO SEZIONE 1 -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar p-3">
            <div class="text-center mb-4 pb-3 border-bottom border-secondary">
                <h5 class="text-warning fw-bold mb-1">WINNER</h5>
                <small class="text-light">Società Cooperativa</small>
            </div>
            <div class="d-flex flex-column" id="menuLaterale">
                <button class="menu-btn">1. Nota Spese</button>
            </div>
        </nav>

        <!-- 💻 CONTENUTO APPLICAZIONE -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pt-4">
            
            <!-- 1. NOTA SPESE -->
            <div id="nota-spese">
                <div class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom">
                    <h1 class="h3 text-gray-800">1. Nota Spese</h1>
                </div>
                
                <!-- Box Inserimento Rapido Riga -->
                <div class="card-custom">
                    <h6 class="fw-bold text-primary mb-3">Aggiungi Nuova Trasferta</h6>
                    <div class="row g-2">
                        <div class="col-md-2"><input type="date" class="form-control" id="insData"></div>
                        <div class="col-md-2"><input type="text" class="form-control" id="insComune" placeholder="Comune"></div>
                        <div class="col-md-3">
                            <select class="form-select" id="insCoordinatore">
                                <option value="" selected disabled>Seleziona Coordinatore...</option>
                                <option value="Coordinatore Bruscolini">Coordinatore Bruscolini</option>
                                <option value="Coordinatore Calzetta">Coordinatore Calzetta</option>
                                <option value="Coordinatore Casaburi">Coordinatore Casaburi</option>
                                <option value="Coordinatore Ceniti">Coordinatore Ceniti</option>
                                <option value="Coordinatore Ledda">Coordinatore Ledda</option>
                                <option value="Coordinatore Mazzoleni">Coordinatore Mazzoleni</option>
                                <option value="Coordinatore Migliaccio">Coordinatore Migliaccio</option>
                                <option value="Coordinatore Piccinetti">Coordinatore Piccinetti</option>
                                <option value="Coordinatore Stella">Coordinatore Stella</option>
                                <option value="Coordinatore Vendemini">Coordinatore Vendemini</option>
                            </select>
                        </div>
                        <div class="col-md-1"><input type="number" class="form-control" id="insKm" placeholder="Km"></div>
                        <div class="col-md-1"><input type="number" step="0.01" class="form-control" id="insAuto" placeholder="Autostr. €"></div>
                        <div class="col-md-1"><input type="number" step="0.01" class="form-control" id="insVitto" placeholder="Vitto €"></div>
                        <div class="col-md-1"><input type="number" step="0.01" class="form-control" id="insVarie" placeholder="Varie €"></div>
                        <div class="col-md-1"><button class="btn btn-success w-100" onclick="aggiungiRigaDinamica()">+ Inserisci</button></div>
                    </div>
                </div>

                <!-- Tabella Principale Spese -->
                <div class="card-custom">
                    <div class="table-responsive">
                        <table class="table table-striped table-bordered align-middle">
                            <thead class="table-custom text-center">
                                <tr>
                                    <th>Data</th>
                                    <th>Comune</th>
                                    <th>Coordinatore di Zona</th>
                                    <th>Km</th>
                                    <th>Tot. Km/€ (0,25€)</th>
                                    <th>Autostrade</th>
                                    <th>Vitto</th>
                                    <th>Varie</th>
                                    <th>Totale €</th>
                                </tr>
                            </thead>
                            <tbody id="corpoTabellaPrincipale">
                                <!-- Righe inserite appariranno qui -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script>
    // Inserimento righe calcolato dinamicamente
    function aggiungiRigaDinamica() {
        let data = document.getElementById('insData').value || '-';
        let comune = document.getElementById('insComune').value || '-';
        let coord = document.getElementById('insCoordinatore').value || '-';
        let km = parseFloat(document.getElementById('insKm').value) || 0;
        let auto = parseFloat(document.getElementById('insAuto').value) || 0;
        let vitto = parseFloat(document.getElementById('insVitto').value) || 0;
        let varie = parseFloat(document.getElementById('insVarie').value) || 0;

        let totKmEuro = km * 0.25;
        let totaleRiga = totKmEuro + auto + vitto + varie;

        let corpo = document.getElementById('corpoTabellaPrincipale');
        let riga = document.createElement('tr');
        riga.innerHTML = `
            <td class="text-center">${data}</td>
            <td>${comune}</td>
            <td>${coord}</td>
            <td class="text-end">${km}</td>
            <td class="text-end">€ ${totKmEuro.toFixed(2)}</td>
            <td class="text-end">€ ${auto.toFixed(2)}</td>
            <td class="text-end">€ ${vitto.toFixed(2)}</td>
            <td class="text-end">€ ${varie.toFixed(2)}</td>
            <td class="text-end fw-bold table-success">€ ${totaleRiga.toFixed(2)}</td>
        `;
        corpo.appendChild(riga);

        // Reset dei campi di input dopo l'inserimento
        document.getElementById('insComune').value = '';
        document.getElementById('insKm').value = '';
        document.getElementById('insAuto').value = '';
        document.getElementById('insVitto').value = '';
        document.getElementById('insVarie').value = '';
    }
</script>
</body>
</html>

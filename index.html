<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winner Coop - Nota Spese Excel Style</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: Arial, sans-serif; padding: 20px; }
        .excel-table th { background-color: #212529; color: white; text-align: center; font-size: 13px; vertical-align: middle; }
        .excel-table td { padding: 4px; }
        .excel-table input, .excel-table select { border: 1px solid #ced4da; border-radius: 0; font-size: 13px; padding: 4px; }
        .excel-table input:focus, .excel-table select:focus { border-color: #28a745; box-shadow: none; }
        .bg-legenda-formula { background-color: #ffffcc; }
        .bg-legenda-tendina { background-color: #cce5ff; }
        .bg-totale { background-color: #e9ecef; font-weight: bold; }
        .header-box { border: 2px solid #28a745; background-color: #e8f5e9; padding: 15px; border-radius: 4px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <!-- Intestazione Aziendale -->
    <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-white border rounded shadow-sm">
        <div>
            <h4 class="text-danger fw-bold mb-0">WINNER</h4>
            <small class="text-muted fw-bold">Winner Società Cooperativa - Tel: 0766 505 197</small>
        </div>
        <div class="text-end">
            <h5 class="fw-bold text-success mb-0">REGISTRO TRASFERTE 2026</h5>
            <small class="text-muted">Rimborso Chilometrico: <strong>€ 0,25 / Km</strong></small>
        </div>
    </div>

    <!-- Info Dipendente -->
    <div class="row g-3 mb-4 bg-white p-3 border rounded shadow-sm">
        <div class="col-md-4">
            <label class="form-label fw-bold small text-uppercase">Nome e Cognome</label>
            <input type="text" class="form-control" value="LORENZO VALLEGGI">
        </div>
        <div class="col-md-4">
            <label class="form-label fw-bold small text-uppercase">Tipologia / Sede Ispettore</label>
            <input type="text" class="form-control" value="PISA">
        </div>
        <div class="col-md-4">
            <label class="form-label fw-bold small text-uppercase">Stato Documento</label>
            <div class="form-control bg-success text-white text-center fw-bold">Corretta</div>
        </div>
    </div>

    <!-- Tabella stile Foglio Excel -->
    <div class="bg-white p-3 border rounded shadow-sm">
        <div class="table-responsive">
            <table class="table table-bordered excel-table align-middle">
                <thead>
                    <tr>
                        <th style="width: 12%;">Data</th>
                        <th style="width: 15%;">Comune</th>
                        <th style="width: 20%;">Coordinatore di Zona</th>
                        <th style="width: 8%;">Km</th>
                        <th style="width: 11%;">Tot. Km/€ (€0.25)</th>
                        <th style="width: 10%;">Autostrade (€)</th>
                        <th style="width: 10%;">Vitto (€)</th>
                        <th style="width: 10%;">Varie (€)</th>
                        <th style="width: 11%;">Totale Giornaliero (€)</th>
                    </tr>
                </thead>
                <tbody id="excelCorpoTabella">
                    <!-- Riga 1 Precompilata come da tua foto -->
                    <tr>
                        <td><input type="date" class="form-control text-center" value="2026-09-01"></td>
                        <td><input type="text" class="form-control" value="Montecatini Terme"></td>
                        <td class="bg-legenda-tendina">
                            <select class="form-select">
                                <option value="Coordinatore Bruscolini" selected>Coordinatore Bruscolini</option>
                                <option value="Coordinatore Calzetta">Coordinatore Calzetta</option>
                                <option value="Coordinatore Casaburi">Coordinatore Casaburi</option>
                                <option value="Coordinatore Ceniti">Coordinatore Ceniti</option>
                                <option value="Coordinatore Ledda">Coordinatore Ledda</option>
                                <option value="Coordinatore Mazzoleni">Coordinatore Mazzoleni</option>
                                <option value="Coordinatore Migliaccio">Coordinatore Migliaccio</option>
                                <option value="Coordinatore Piccinetti">Coordinatore Piccinetti</option>
                                <option value="Coordinatore Stella">Coordinatore Stella</option>
                                <option value="Coordinatore Vendemini">Coordinatore Vendemini</option>
                            </select>
                        </td>
                        <td><input type="number" class="form-control text-center input-km" value="127" oninput="calcolaFogliov2(this)"></td>
                        <td class="bg-legenda-formula"><input type="text" class="form-control text-end bg-totale output-km-euro" value="€ 31.75" readonly></td>
                        <td><input type="number" step="0.01" class="form-control text-end input-auto" value="3.50" oninput="calcolaFogliov2(this)"></td>
                        <td><input type="number" step="0.01" class="form-control text-end input-vitto" value="0.00" oninput="calcolaFogliov2(this)"></td>
                        <td><input type="number" step="0.01" class="form-control text-end input-varie" value="0.00" oninput="calcolaFogliov2(this)"></td>
                        <td class="bg-legenda-formula"><input type="text" class="form-control text-end bg-totale riga-totale-generale" value="€ 35.25" readonly></td>
                    </tr>
                </tbody>
                <!-- Riga dei Totali di Fine Mese -->
                <tfoot>
                    <tr class="table-secondary fw-bold text-end">
                        <td colspan="3" class="text-center">RECAP TOTALI:</td>
                        <td id="sommaKm" class="text-center">127</td>
                        <td id="sommaKmEuro">€ 31.75</td>
                        <td id="sommaAuto">€ 3.50</td>
                        <td id="sommaVitto">€ 0.00</td>
                        <td id="sommaVarie">€ 0.00</td>
                        <td id="sommaAssoluta" class="table-success fw-bold">€ 35.25</td>
                    </tr>
                </tfoot>
            </table>
        </div>
        
        <!-- Pulsante stile foglio elettronico per aggiungere righe -->
        <div class="mt-3">
            <button class="btn btn-dark btn-sm" onclick="inserisciRigaExcel()">+ Inserisci Nuova Riga Giorno</button>
        </div>
    </div>
</div>

<script>
    // Funzione matematica di calcolo automatico della riga e delle colonne totali
    function calcolaFogliov2(input) {
        let riga = input.closest('tr');
        
        let km = parseFloat(riga.querySelector('.input-km').value) || 0;
        let auto = parseFloat(riga.querySelector('.input-auto').value) || 0;
        let vitto = parseFloat(riga.querySelector('.input-vitto').value) || 0;
        let varie = parseFloat(riga.querySelector('.input-varie').value) || 0;
        
        // Calcolo rimborso Km a 0,25
        let kmEuro = km * 0.25;
        riga.querySelector('.output-km-euro').value = '€ ' + kmEuro.toFixed(2);
        
        // Calcolo totale riga
        let totaleRiga = kmEuro + auto + vitto + varie;
        riga.querySelector('.riga-totale-generale').value = '€ ' + totaleRiga.toFixed(2);
        
        // Aggiorna i totali generali in basso al foglio
        aggiornaTotaliFinali();
    }

    function aggiornaTotaliFinali() {
        let totaleKm = 0, totaleKmEuro = 0, totaleAuto = 0, totaleVitto = 0, totaleVarie = 0, totaleAssoluto = 0;
        
        document.querySelectorAll('#excelCorpoTabella tr').forEach(riga => {
            let km = parseFloat(riga.querySelector('.input-km').value) || 0;
            let auto = parseFloat(riga.querySelector('.input-auto').value) || 0;
            let vitto = parseFloat(riga.querySelector('.input-vitto').value) || 0;
            let varie = parseFloat(riga.querySelector('.input-varie').value) || 0;
            
            totaleKm += km;
            totaleKmEuro += (km * 0.25);
            totaleAuto += auto;
            totaleVitto += vitto;
            totaleVarie += varie;
        });
        
        totaleAssoluto = totaleKmEuro + totaleAuto + totaleVitto + totaleVarie;
        
        document.getElementById('sommaKm').innerText = totaleKm;
        document.getElementById('sommaKmEuro').innerText = '€ ' + totaleKmEuro.toFixed(2);
        document.getElementById('sommaAuto').innerText = '€ ' + totaleAuto.toFixed(2);
        document.getElementById('sommaVitto').innerText = '€ ' + totaleVitto.toFixed(2);
        document.getElementById('sommaVarie').innerText = '€ ' + totaleVarie.toFixed(2);
        document.getElementById('sommaAssoluta').innerText = '€ ' + totaleAssoluto.toFixed(2);
    }

    // Inserisce una riga vuota mantenendo formule e menu a tendina completi
    function inserisciRigaExcel() {
        let corpo = document.getElementById('excelCorpoTabella');
        let nuovaRiga = document.createElement('tr');
        nuovaRiga.innerHTML = `
            <td><input type="date" class="form-control text-center"></td>
            <td><input type="text" class="form-control"></td>
            <td class="bg-legenda-tendina">
                <select class="form-select">
                    <option value="Coordinatore Bruscolini">Coordinatore Bruscolini</option>
                    <option value="Coordinatore Calzetta">Coordinatore Calzetta</option>
                    <option value="Coordinatore Casaburi">Coordinatore Casaburi</option>
